name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the fixed verification toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck bats cryptsetup-bin
      - name: Run the complete local verification entrypoint
        run: sudo bash verify.sh
